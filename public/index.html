
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>PoeageHub | Online Shopping Marketplace</title>

  <meta
    name="description"
    content="Discover quality products at PoeageHub, your online shopping marketplace. Explore categories, new arrivals, best sellers and special offers."
  />

  <meta
    name="keywords"
    content="PoeageHub, online shopping, ecommerce, online marketplace, buy products online, shopping India, multi vendor marketplace"
  />

  <meta name="author" content="Poeage Technology Private Limited" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#ffffff" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://poeage.com/" />

  <!-- Favicon: System Light / Dark Preference -->
  <link
    rel="icon"
    type="image/png"
    href="/1.png"
    media="(prefers-color-scheme: light)"
  />

  <link
    rel="icon"
    type="image/png"
    href="/2.png"
    media="(prefers-color-scheme: dark)"
  />

  <!-- Fallback Icon -->
  <link rel="icon" type="image/png" href="/1.png" />

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="/1.png" />

  <!-- Open Graph SEO -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="PoeageHub | Online Shopping Marketplace" />
  <meta
    property="og:description"
    content="Shop smarter with PoeageHub. Discover products, explore categories and find great offers."
  />
  <meta property="og:url" content="https://poeage.com/" />
  <meta property="og:site_name" content="PoeageHub" />
  <meta property="og:image" content="https://poeage.com/1.png" />

  <!-- Twitter SEO -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="PoeageHub | Online Shopping Marketplace" />
  <meta
    name="twitter:description"
    content="Discover products and shop online with PoeageHub."
  />
  <meta name="twitter:image" content="https://poeage.com/1.png" />

  <!-- Performance -->
  <meta name="format-detection" content="telephone=no" />

</head>

<body>
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
