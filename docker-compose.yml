services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: poeage_ecom
      POSTGRES_USER: poeage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-this-local-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - poeage-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poeage -d poeage_ecom"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  poeage-postgres-data:
